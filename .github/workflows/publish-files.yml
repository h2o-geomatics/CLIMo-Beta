name: Publish the files of a release

# Runs when someone presses Publish on a draft release. The release carries the documentation and notices of that
# version in CLIMo-<version>-public-files.zip; this puts them on the main branch, so that the pages always match the
# newest release. Workflows are left out: this job's token may not change them, and they change rarely.
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: publish-files

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Replace the files with those of the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --pattern '*-public-files.zip' --dir "$RUNNER_TEMP"
          git ls-files -z | grep -zv '^\.github/workflows/' | xargs -0 -r git rm -q --
          unzip -q "$RUNNER_TEMP"/*-public-files.zip -x '.github/workflows/*'
      - name: Commit
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Documentation for $TAG"
            git push origin HEAD:main
          fi
